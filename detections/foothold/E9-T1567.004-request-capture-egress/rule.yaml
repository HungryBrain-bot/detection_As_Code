id: d71da068-5434-4df4-9742-5cbf815cd924
name: Server connects to a request-capture service (webhook.site, interactsh)
version: 1
status: experimental
severity: High
tier: targeted
description: >
  A server (Defender for Endpoint OS platform Windows Server or Linux)
  makes a network connection whose URL host is, or is under, a
  request-capture service: webhook.site and its DNS capture domain, or
  ProjectDiscovery's public interactsh servers. Attackers use these to
  confirm SSRF and blind command execution and to post data out. The
  domain list is a per-customer parameter (ADR 012).
log_sources: [mde-advanced-hunting]
mapping:
  attack:
    techniques: [T1567.004]
    tactics: [exfiltration]

sentinel:
  query_frequency: PT1H
  query_period: P1D
  required_fields:
    DeviceNetworkEvents: [TimeGenerated, DeviceId, DeviceName, RemoteUrl, RemoteIP, RemotePort, InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName]
    DeviceInfo: [TimeGenerated, DeviceId, OSPlatform, DeviceType]
  query: |
    // E9: server connects to a request-capture service (detections/foothold/E9-T1567.004-request-capture-egress/README.md)
    // Per customer: request-capture domains. Defaults are the ones confirmed from the services' own pages (README).
    let capture_domains = dynamic(["webhook.site", "dnshook.site", "oast.pro", "oast.live", "oast.site", "oast.online", "oast.fun", "oast.me"]);
    let servers = DeviceInfo
    | summarize arg_max(TimeGenerated, OSPlatform, DeviceType) by DeviceId
    | where OSPlatform startswith "WindowsServer" or OSPlatform =~ "Linux" or DeviceType =~ "Server"
    | project DeviceId, OSPlatform;
    DeviceNetworkEvents
    | where TimeGenerated >= ago(1h) and isnotempty(RemoteUrl)
    | extend UrlHost = tolower(extract(@"^(?:[A-Za-z][A-Za-z0-9+.-]*://)?([^/:?#]+)", 1, RemoteUrl))
    | where UrlHost has_any (capture_domains)
    | mv-apply Domain = capture_domains to typeof(string) on (where UrlHost == Domain or UrlHost endswith strcat(".", Domain) | take 1)
    | join kind=inner servers on DeviceId
    | project TimeGenerated, DeviceName, OSPlatform, UrlHost, RemoteUrl, RemoteIP, RemotePort, Domain,
              Process = InitiatingProcessFileName, ProcessCommandLine = InitiatingProcessCommandLine,
              Account = InitiatingProcessAccountName
