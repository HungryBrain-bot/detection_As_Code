id: 9e68e175-39e2-43ec-8f12-efc2493c544d
name: One API Gateway client reads many record IDs in sequence or with many denials
version: 1
status: test
severity: Medium
tier: targeted
description: >
  AWS port of E1 (ADR 014). One client (source address and, when the
  API logs one, the authenticated user) requests at least 20 distinct
  record IDs on one API Gateway domain within 10 minutes, and either most
  steps go up by a small amount, or at least 30 percent of answers are
  403 or 404 with some 200s among them, or the bytes returned are at
  least 10 times the domain's usual per-client figure. That is what
  working through an IDOR looks like. Record IDs come from the path only
  (API Gateway logs no query string). Reads the access log format this
  project defines (docs/components/apigateway-access-log.md).
log_sources: [aws-apigateway-access]
mapping:
  attack:
    techniques: [T1190]
    tactics: [initial-access]

sentinel:
  query_frequency: PT1H
  query_period: P14D
  required_fields:
    AWSCloudWatch: [TimeGenerated, Message]
  query: |
    // E10: sequential record access, API Gateway (detections/foothold/E10-T1190-apigw-sequential-record-access/README.md)
    let recent = 1h;                  // alert on this window; 14 days to 1 day ago is the volume baseline
    let bin_size = 10m;
    let min_distinct_ids = 20;
    let max_step = 5;                 // an "in order" step: the ID went up by 1 to max_step
    let min_increasing_share = 0.6;   // share of steps that are "in order"
    let min_error_share = 0.3;        // 403/404 share, with at least one 200
    let min_volume_ratio = 10.0;      // bytes returned vs the 95th percentile for the domain, per client per bin
    // Per API: where the record ID is. Path segment after a record noun (the stage prefix is skipped by the search).
    let record_path = @"(?i)/(?:customers?|accounts?|loans?|applications?|orders?|users?|records?|documents?|invoices?|statements?)/([0-9]{1,12})(?:/|$)";
    let requests = AWSCloudWatch
    // API Gateway access log lines in the JSON format of this project; other CloudWatch logs are skipped.
    | where Message startswith "{" and Message has "apiId" and Message has "requestTimeEpoch"
    | extend L = parse_json(Message)
    | where isnotempty(tostring(L.apiId)) and isnotempty(tostring(L.status))
    | extend Epoch = tolong(L.requestTimeEpoch)
    | extend RequestTime = iff(Epoch > 100000000000, unixtime_milliseconds_todatetime(Epoch), unixtime_seconds_todatetime(Epoch))
    | extend RecordId = tolong(extract(record_path, 1, tostring(L.path)))
    | where isnotnull(RecordId)
    | extend Host = tostring(L.domainName), ClientIp = tostring(L.sourceIp), User = tostring(L.user),
             Status = toint(L.status), Bytes = tolong(L.responseLength), Path = tostring(L.path), UserAgent = tostring(L.userAgent)
    | extend User = iff(User in ("", "-"), "", User)
    | extend Client = strcat(ClientIp, "|", iff(isempty(User), "-", User)), Window = bin(RequestTime, bin_size);
    // TimeGenerated (possibly the ingestion time) picks the windows; RequestTime orders and bins the requests.
    let baseline = requests
    | where TimeGenerated between (ago(14d) .. ago(1d))
    | summarize Bytes = sum(Bytes) by Host, Client, Window
    | summarize BaselineBytes = percentile(Bytes, 95), BaselineBins = count() by Host;
    requests
    | where TimeGenerated >= ago(recent)
    | sort by Host asc, Client asc, RequestTime asc
    | extend Step = iff(prev(Host) == Host and prev(Client) == Client and prev(Window) == Window, RecordId - prev(RecordId), long(null))
    | summarize Requests = count(), DistinctIds = dcount(RecordId), Steps = countif(isnotnull(Step)),
                InOrder = countif(Step between (1 .. max_step)), Ok = countif(Status == 200),
                Denied = countif(Status in (403, 404)), Bytes = sum(Bytes), MinId = min(RecordId), MaxId = max(RecordId),
                ClientIp = take_any(ClientIp), User = take_any(User), UserAgents = make_set(UserAgent, 5),
                SamplePaths = make_set(Path, 10), FirstSeen = min(RequestTime), LastSeen = max(RequestTime)
        by Host, Client, Window
    | join kind=leftouter baseline on Host
    | extend IncreasingShare = round(todouble(InOrder) / iff(Steps == 0, 1, Steps), 2),
             ErrorShare = round(todouble(Denied) / Requests, 2),
             VolumeRatio = iff(isnull(BaselineBytes) or BaselineBytes <= 0, real(null), round(Bytes / BaselineBytes, 1))
    | extend Reasons = set_difference(pack_array(
               iff(IncreasingShare >= min_increasing_share, "ids-in-order", ""),
               iff(ErrorShare >= min_error_share and Ok > 0, "denials-mixed-with-200", ""),
               iff(VolumeRatio >= min_volume_ratio, "volume-above-baseline", "")), dynamic([""]))
    | where DistinctIds >= min_distinct_ids and array_length(Reasons) > 0
    | extend TimeGenerated = LastSeen
    | project TimeGenerated, Host, ClientIp, User, Window, Requests, DistinctIds, MinId, MaxId, IncreasingShare, ErrorShare,
              Ok, Denied, Bytes, BaselineBytes, VolumeRatio, Reasons, UserAgents, SamplePaths, FirstSeen, LastSeen
