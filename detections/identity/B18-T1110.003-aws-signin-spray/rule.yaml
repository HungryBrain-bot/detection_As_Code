id: aecdfc7b-d0f0-492f-918d-c35599737030
name: Many AWS sign-in accounts fail with a wrong password, or the same accounts are sprayed again
version: 1
status: test
severity: Medium
tier: targeted
description: >
  AWS port of B8 (ADR 014). Counted from the account side, not per
  source IP, over AWS Management Console sign-ins of IAM users and root
  (ConsoleLogin) and IAM Identity Center password checks
  (CredentialVerification). Alerts when, in one hour, at least 15
  accounts fail and do not sign in successfully that hour; or when at
  least 5 accounts fail that way in two or more hours that were each
  spray hours (10 or more such accounts). User names AWS hides because
  they do not exist are not counted as accounts.
log_sources: [aws-cloudtrail]
mapping:
  attack:
    techniques: [T1110.003]
    tactics: [credential-access]

sentinel:
  query_frequency: PT1H
  query_period: PT6H
  required_fields:
    AWSCloudTrail: [TimeGenerated, EventSource, EventName, ErrorMessage, ResponseElements, AdditionalEventData, ServiceEventDetails, UserIdentityType, UserIdentityUserName, RecipientAccountId, SourceIpAddress, UserAgent]
  query: |
    // B18: account-side password spray, AWS console and IAM Identity Center (detections/identity/B18-T1110.003-aws-signin-spray/README.md)
    let round_size = 1h;
    let min_accounts = 15;        // breadth: failing accounts in one round
    let min_spray_round = 10;     // a round with this many failing accounts is a spray round
    let min_retargeted = 5;       // accounts failing in two or more spray rounds
    let hidden = "HIDDEN_DUE_TO_SECURITY_REASONS";   // AWS writes this for a user name that does not exist
    let signin = AWSCloudTrail | where EventSource == "signin.amazonaws.com";
    // IAM users and root: ConsoleLogin, result in responseElements.ConsoleLogin.
    let console = signin
    | where EventName == "ConsoleLogin"
    | extend Result = tostring(parse_json(ResponseElements).ConsoleLogin)
    | where Result in ("Success", "Failure") and UserIdentityUserName != hidden
    | extend Account = case(UserIdentityType == "Root", strcat(RecipientAccountId, "/root"),
                            isnotempty(UserIdentityUserName), strcat(RecipientAccountId, "/", tolower(UserIdentityUserName)), "")
    | where isnotempty(Account)
    | extend Failed = Result == "Failure", Surface = "console", Detail = iff(Result == "Failure", ErrorMessage, "");
    // IAM Identity Center: the password result is on CredentialVerification, the user name on the
    // CredentialChallenge of the same sign-in (AuthWorkflowID).
    let sso_events = signin
    | where EventName in ("CredentialChallenge", "CredentialVerification")
    | extend Extra = parse_json(AdditionalEventData)
    | extend Workflow = tostring(Extra.AuthWorkflowID), CredentialType = tostring(Extra.CredentialType);
    let sso_users = sso_events
    | where EventName == "CredentialChallenge" and isnotempty(tostring(Extra.UserName))
    | summarize UserName = take_any(tostring(Extra.UserName)) by Workflow;
    let sso = sso_events
    | where EventName == "CredentialVerification" and CredentialType == "PASSWORD"
    | extend Result = tostring(parse_json(ServiceEventDetails).CredentialVerification)
    | where Result in ("Success", "Failure")
    | join kind=inner sso_users on Workflow
    | where UserName != hidden
    | extend Account = strcat("identity-center/", tolower(UserName)), Failed = Result == "Failure", Surface = "identity-center",
             Detail = iff(Result == "Failure", "CredentialVerification Failure", "");
    let attempts = union console, sso
    | extend Round = bin(TimeGenerated, round_size), IPAddress = SourceIpAddress;
    // An account counts in a round if it failed and did not also sign in successfully in that round.
    let failing = attempts
    | summarize Failures = countif(Failed), Successes = countif(not(Failed)) by Account, Round
    | where Failures > 0 and Successes == 0
    | project Account, Round;
    let failed = attempts | where Failed | join kind=inner failing on Account, Round;
    let per_ip = failed | summarize IPFailures = count() by Round, IPAddress;
    let breadth = failed
    | summarize FailingAccounts = dcount(Account), Accounts = make_set(Account, 50), Failures = count(),
                DistinctIPs = dcount(IPAddress), Details = make_set(Detail, 10), Surfaces = make_set(Surface),
                UserAgents = make_set(UserAgent, 10), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated)
        by Round
    | where FailingAccounts >= min_accounts
    | join kind=inner (per_ip | summarize MaxFailuresPerIP = max(IPFailures) by Round) on Round
    | extend Reason = "breadth", SprayRounds = 1;
    let spray_rounds = failing | summarize RoundAccounts = dcount(Account) by Round | where RoundAccounts >= min_spray_round;
    let retargeted_accounts = failing
    | join kind=inner spray_rounds on Round
    | summarize SprayRounds = dcount(Round) by Account
    | where SprayRounds >= 2;
    let retargeted = failed | join kind=inner retargeted_accounts on Account;
    let retarget = retargeted
    | summarize FailingAccounts = dcount(Account), Accounts = make_set(Account, 50), Failures = count(),
                DistinctIPs = dcount(IPAddress), Details = make_set(Detail, 10), Surfaces = make_set(Surface),
                UserAgents = make_set(UserAgent, 10), SprayRounds = dcount(Round), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated)
    | where FailingAccounts >= min_retargeted
    | extend MaxFailuresPerIP = toscalar(retargeted | summarize n = count() by IPAddress | summarize max(n)),
             Reason = "re-targeted", Round = datetime(null);
    union breadth, retarget
    // Distributed: many sources, each with few attempts. Reported, not required.
    | extend Distributed = DistinctIPs >= 10 and MaxFailuresPerIP <= 3
    | extend TimeGenerated = LastSeen
    | project TimeGenerated, Reason, Round, FailingAccounts, SprayRounds, Failures, DistinctIPs, MaxFailuresPerIP,
              Distributed, Surfaces, Details, UserAgents, Accounts, FirstSeen, LastSeen
