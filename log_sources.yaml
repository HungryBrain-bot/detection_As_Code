# Log-source catalogue. Each rule lists the IDs it needs in `log_sources`;
# the log-source gate (dac/gate/) reminds the owning team to confirm the
# source is onboarded in each SIEM before the rule is deployed there.
#
# `siem` maps each SIEM to the table / sourcetype / log type names the
# rule's query may reference. The query validators check that a query
# references at least one of these names, so a rule cannot quietly
# query a source it did not declare. A SIEM missing from `siem` means
# the source is not expected to exist there.
#
# `owner` is a team key that each customer defines in its own
# customers/<id>/teams.yaml.
#
# These are each product's conventional names, not names taken from a
# live tenant. Adjust them to the real environment.

windows-process-creation:
  description: Process creation with full command line (Security 4688 with command-line auditing on, or Sysmon event 1).
  owner: endpoint-team
  siem:
    # Sysmon reaches Sentinel in the Event table (Source "Microsoft-Windows-Sysmon"),
    # per Microsoft's Sysmon parser in the Azure-Sentinel repo.
    sentinel: [SecurityEvent, Event]
    splunk: ["XmlWinEventLog:Microsoft-Windows-Sysmon/Operational", "XmlWinEventLog:Security"]
    secops: [WINDOWS_SYSMON]

windows-registry-set:
  description: Registry value set events (Sysmon event 13).
  owner: endpoint-team
  siem:
    sentinel: [Event]
    splunk: ["XmlWinEventLog:Microsoft-Windows-Sysmon/Operational"]
    secops: [WINDOWS_SYSMON]

windows-powershell-scriptblock:
  description: PowerShell script block logging (event 4104).
  owner: endpoint-team
  siem:
    sentinel: [Event]
    splunk: ["XmlWinEventLog:Microsoft-Windows-PowerShell/Operational"]
    secops: [POWERSHELL]

entra-audit:
  description: Entra ID audit log (app consent, app permission and credential changes).
  owner: identity-team
  siem:
    sentinel: [AuditLogs]

entra-signin:
  description: Entra ID interactive and non-interactive sign-in logs.
  owner: identity-team
  siem:
    sentinel: [SigninLogs, AADNonInteractiveUserSignInLogs]

llm-app-log:
  description: Normalised LLM application log (prompts, outputs, tool calls), one row per OpenTelemetry GenAI span. Sources and mapping in llm_log_inventory.yaml.
  owner: ai-platform-team
  siem:
    sentinel: [LLMAppLog_CL]

llm-canary-registry:
  description: Active canary values planted in LLM system prompts, tool configuration or documents, re-sent at least hourly (llm_log_inventory.yaml).
  owner: ai-platform-team
  siem:
    sentinel: [LLMCanary_CL]

# Added 2026-11-07 for rules B4-B7 (ARTEX Phase 1, credential sourcing; ADR 009).
entra-sp-signin:
  description: Entra ID service principal sign-in log (app-only sign-ins with a client secret or certificate, incl. the credential key id and ASN).
  owner: identity-team
  siem:
    sentinel: [AADServicePrincipalSignInLogs]

entra-graph-activity:
  description: Microsoft Graph activity log (every Graph API request, with app id, service principal id, method, URI, status and user agent). Needs the MicrosoftGraphActivityLogs diagnostic setting.
  owner: identity-team
  siem:
    sentinel: [MicrosoftGraphActivityLogs]

azure-keyvault-audit:
  description: Azure Key Vault AuditEvent diagnostic logs in Azure Diagnostics mode (secret, key and vault operations with the caller's app id and IP).
  owner: cloud-platform-team
  siem:
    sentinel: [AzureDiagnostics]

honeytoken-registry:
  description: Active honeytokens (decoy service principal app ids and decoy Key Vault object names), re-sent at least hourly (schemas/reference/sentinel/Honeytoken_CL.yaml).
  owner: detection-team
  siem:
    sentinel: [Honeytoken_CL]

# Added 2026-11-07 for rules D1-D4 (ARTEX Phase 2, recon; ADR 010).
app-service-http:
  description: Azure App Service HTTP access log (path, query, status, client IP, user agent, host). Needs the AppServiceHTTPLogs diagnostic setting; apps on other hosts (Application Gateway, Front Door, a VM) are not covered.
  owner: app-platform-team
  siem:
    sentinel: [AppServiceHTTPLogs]

aws-cloudtrail:
  description: AWS CloudTrail management events in Sentinel (the AWS S3 connector), including failed calls with their error code.
  owner: cloud-platform-team
  siem:
    sentinel: [AWSCloudTrail]

# Added 2026-11-07 for rules E1-E9 (ARTEX Phase 4, initial exploitation and foothold; ADR 012).
# E1 reads app-service-http (above).
mde-advanced-hunting:
  description: Microsoft Defender for Endpoint advanced hunting tables streamed to Sentinel by the Microsoft Defender XDR connector (process, file and network events, device inventory), Windows and Linux.
  owner: endpoint-team
  siem:
    sentinel: [DeviceProcessEvents, DeviceFileEvents, DeviceNetworkEvents, DeviceInfo]

windows-file-creation:
  description: File creation events (Sysmon event 11) on Windows, in the Event table.
  owner: endpoint-team
  siem:
    sentinel: [Event]

linux-sysmon-syslog:
  description: Sysmon for Linux events (process creation, event 1) sent to Sentinel through the Syslog connector; the event XML is in SyslogMessage, as Microsoft's ASIM Sysmon for Linux parsers read it.
  owner: endpoint-team
  siem:
    sentinel: [Syslog]

app-service-audit:
  description: Azure App Service publishing logins (FTP, Kudu, Web Deploy). Needs the AppServiceAuditLogs diagnostic setting on each app.
  owner: app-platform-team
  siem:
    sentinel: [AppServiceAuditLogs]
