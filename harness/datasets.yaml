# Recorded attack datasets the engine harness loads (docs/components/engine-tests.md).
#
# Each entry is pinned to a commit and a SHA-256 so a rerun loads the same
# bytes. `python -m harness fetch` downloads and verifies them into
# data/datasets/ (gitignored); nothing here is committed except the
# extracts in each rule's tests/positive.json and tests/negative.json.
#
# OTRF Security-Datasets: MIT License, Copyright (c) 2021 Open Threat
# Research Forge (https://github.com/OTRF/Security-Datasets/blob/master/LICENSE,
# fetched 2026-10-27). Events were collected by NXLog (im_msvistalog) from a
# lab domain and flattened to JSON; see harness/mapping.py for how they are
# turned back into each SIEM's shape.
#
# Splunk attack_data: Apache License 2.0
# (https://github.com/splunk/attack_data/blob/master/LICENSE, fetched 2026-10-27).
# Entra ID logs recorded in Splunk's "attack_range" lab tenant and exported
# in the Azure Monitor diagnostic format (sourcetype azure:monitor:aad). Each
# dataset's .yml says "Tenant specific details have been replaced in the
# dataset including tenant id, user names, ips"; the IP addresses and names
# are therefore Splunk's replacements, not the lab's. The files are stored in
# Git LFS, so they are fetched from media.githubusercontent.com.
#
# `source` picks the URL (harness/__main__.py SOURCES); default otrf.
# A path ending in .zip is extracted; any other file is saved as is.

otrf-commit: &otrf d9d40ef123d2c87d5d3df28c96bcab4f0faccc87
splunk-commit: &splunk b52ee687423a305c677ef9db42c1656e73cce210

