  # ---- LLM track (ADR 008). No recorded LLM-application log dataset exists;
  # these are research datasets of prompts, attack texts and agent runs,
  # converted to LLMAppLog_CL rows by harness/llm_datasets.py (`format`).
  # `source: github` reads raw.githubusercontent.com/{repo}/{commit}/{path}.
  # `files` lists several files; `manifest` names a sha256sum-style file in
  # this repo listing many. Multi-file entries are saved under their path
  # with "/" replaced by "__".

  jailbreakhub-prompts:
    description: >-
      JailbreakHub ("Do Anything Now", CCS 2024): 1,405 jailbreak prompts and
      13,735 regular prompts collected from Reddit, Discord and prompt websites
      (Dec 2022 - Dec 2023), labelled by the authors. Real prompts, not app logs.
      MIT License, https://github.com/verazuo/jailbreak_llms/blob/main/LICENSE (fetched 2026-10-27).
    source: github
    repo: verazuo/jailbreak_llms
    commit: 4f4031bf8be187f4478c7f94f42b08714722c12e
    format: jailbreakhub-csv
    files:
      - path: data/prompts/jailbreak_prompts_2023_12_25.csv
