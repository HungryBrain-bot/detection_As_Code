# Reference schema for the OktaSSO table (Okta System Log events ingested by the Sentinel
# Okta Single Sign-On connector), with column types. See docs/components/schema-check.md.
# Column names and types are copied from Microsoft's Azure-Sentinel repository
# (.script/tests/KqlvalidationsTests/CustomTables/OktaSSO.json, the table definition Microsoft's
# own KQL validation uses for the Okta solution's rules), not from a live workspace. Microsoft's
# Okta analytic rules (Solutions/Okta Single Sign-On/Analytic Rules/PasswordSpray.yaml, same
# commit) read this table with these column names. The newer OktaV2_CL table (connector v2,
# ASIM-style column names) is not covered. The harness creates the Kusto test table from `types`.
# Added 2026-11-07 for rule B9 (ARTEX Phase 3, identity; ADR 011).
