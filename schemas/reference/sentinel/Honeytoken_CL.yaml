# Reference schema for Honeytoken_CL, the honeytoken registry read by rule B4
# (docs/decisions/009-workload-identity-rules.md). Not a vendor table: defined
# by this project. One row per active honeytoken, re-sent by the registry at
# least once per hour so that B4's lookback period always contains every
# active token (the same contract as LLMCanary_CL and rule C2).
#
# TokenType is one of:
#   ServicePrincipalAppId  - the AppId (client id) of a decoy app registration
#                            whose secret was planted somewhere an attacker looks
#   KeyVaultObject         - the name of a decoy Key Vault secret or key
#
# A Sentinel watchlist is the usual place for this list (the Sentinel
# Deception / HoneyTokens solution uses one, read with _GetWatchlist); it is
# a table here because the harness's Kusto emulator has no _GetWatchlist.
# Switching B4 to a watchlist is a one-line change to its `honeytokens` let.
name: Honeytoken_CL
siem: sentinel
source_url: https://github.com/Azure/Azure-Sentinel/tree/c0c2dc267d7b5840299e76e195b0407f3f9c92c8/Solutions/HoneyTokens
vendor_page: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/logs-ingestion-api-overview
fetched_on: '2026-11-07'
provenance: Defined by this project (ADR 009); not based on any vendor schema. The HoneyTokens
  solution (source_url) was read for the idea only; its watchlist columns were not copied.
fields:
- TimeGenerated
- TokenType
- TokenValue
- PlantedIn
- Type
types:
  TimeGenerated: datetime
  TokenType: string
  TokenValue: string
  PlantedIn: string
  Type: string
