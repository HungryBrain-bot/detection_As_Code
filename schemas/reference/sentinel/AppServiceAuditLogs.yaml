# Reference schema for the AppServiceAuditLogs table (App Service publishing logins), with column types.
# See docs/components/schema-check.md. Columns and types come from Microsoft's Azure Monitor table reference
# page, fetched 2026-11-07 (page read in full through a fetch tool, so not checked character by character).
# Table description: "Logs generated when publishing users successfully log on via one of the App Service
# publishing protocols." The App Service monitoring reference describes it as "Login activity via FTP and Kudu";
# the basic-auth page says "All successful and attempted logins are logged". Only "FTP" is shown as a Protocol
# value; the values for Kudu and Web Deploy are not documented on the pages read. Added 2026-11-07 for rule E8
# (ARTEX Phase 4; ADR 012).
name: AppServiceAuditLogs
siem: sentinel
source_url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/appserviceauditlogs
vendor_page: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/appserviceauditlogs
fetched_on: '2026-11-07'
provenance: Microsoft Learn table reference (last updated 2026-07-28), fetched 2026-11-07 through a fetch tool (full page); 14 columns.
fields:
- _BilledSize
- Category
- _IsBillable
- OperationName
- Protocol
- _ResourceId
- SourceSystem
- _SubscriptionId
- TenantId
- TimeGenerated
- Type
- User
- UserAddress
- UserDisplayName
types:
  _BilledSize: real
  Category: string
  _IsBillable: string
  OperationName: string
  Protocol: string
  _ResourceId: string
  SourceSystem: string
  _SubscriptionId: string
  TenantId: string
  TimeGenerated: datetime
  Type: string
  User: string
  UserAddress: string
  UserDisplayName: string
