# Reference schema for the AzureDiagnostics table, with column types. See docs/components/schema-check.md.
# Column names and types are copied from Microsoft's Azure-Sentinel repository
# (Sample Data/Tables/AzureDiagnostics/metadata.json, "schemaSource": "Microsoft public table schema"),
# not from a live workspace. The harness creates the Kusto test table from `types`.
# AzureDiagnostics is shared by every resource in Azure Diagnostics mode; its real column set
# depends on what each workspace has ingested. These 114 columns are Microsoft's sample set;
# the Key Vault columns the rules read (id_s, requestUri_s, identity_claim_appid_g,
# clientInfo_s, httpStatusCode_d) are in it. Key Vault in resource-specific mode writes
# AZKVAuditLogs instead, which no rule here reads.
