# Detection-as-code pipeline. What each job proves, and what it does not,
# is in docs/components/ci.md.
#
#   validate   every push and PR: lint, tests, rule and customer
#              validation against the current MITRE ATT&CK bundle
#   engine-kusto  every push and PR: each rule's Sentinel query run in the
#              Azure Data Explorer emulator against its samples and the
#              recorded datasets (docs/components/engine-tests.md)
#   customers  lists customer/SIEM pairs from customers/*/customer.yaml
#   gate       PRs, per customer and SIEM: schema check + log-source gate
#              in report-only mode, so owning teams get the reminder while
#              the rule is still in review
#   deploy     push to main, per customer and SIEM: gate (blocking), then
#              deploy; live only when that SIEM's secrets exist
#   coverage   push to main, per customer: Navigator layers + summary
#
# Credentials are per customer: each customer is a GitHub Environment
# named after its folder (customers/<id>/), holding that customer's
# secrets under the plain names below. No customer's job can read
# another customer's secrets.
name: detection-pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint YAML
        run: yamllint .
      - name: Unit tests
        run: python -m pytest
      - name: ATT&CK cache key (ISO week)
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache ATT&CK bundle
        uses: actions/cache@v4
        with:
          path: data/enterprise-attack.json
          # Refreshed weekly so new ATT&CK releases (and deprecations) are picked up.
          key: attack-stix-${{ steps.week.outputs.week }}
      - name: Download ATT&CK bundle
        run: |
          mkdir -p data
          if [ ! -s data/enterprise-attack.json ]; then
            curl -sSfL -o data/enterprise-attack.json \
              https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
          fi
      - name: Download MITRE ATLAS data (pinned by commit and SHA-256)
        run: |
          mkdir -p data
          curl -sSfL -o data/ATLAS-2026.06.yaml \
            https://raw.githubusercontent.com/mitre-atlas/atlas-data/3259f388d19cbcca11bacf12a0ef97f4198f711b/dist/v6/ATLAS-2026.06.yaml
          echo "b771de8b1489564b2838a709c7429849a9575dbd94073928817fe1a21661e70a  data/ATLAS-2026.06.yaml" | sha256sum -c -
      - name: Validate rules and customers
        run: python -m dac validate --attack-bundle data/enterprise-attack.json --atlas-data data/ATLAS-2026.06.yaml

  engine-kusto:
    needs: validate
    runs-on: ubuntu-latest
    services:
      kusto:
        # Kusto emulator, pinned by digest. ACCEPT_EULA accepts Microsoft's
        # licence terms for the emulator, which is for development and test use.
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux@sha256:e65f37c78185cf88c2161e304572d5399553b98c5b606412ea7ee31c812b7fd4
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Wait for the emulator
        run: |
          for i in $(seq 1 60); do
            if curl -sf -X POST http://localhost:8080/v1/rest/mgmt -H 'Content-Type: application/json' \
                 -d '{"csl":".show version"}' > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "Kusto emulator did not start" >&2; exit 1
      - name: Fetch recorded datasets (pinned by SHA-256)
        run: python -m harness fetch
      - name: Run Sentinel queries
        # Fails if a positive sample is missed, a negative matches, or the
        # dataset match count differs from tests/results/kusto.json.
        run: python -m harness run --engine kusto

  customers:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      pairs: ${{ steps.list.outputs.pairs }}
      ids: ${{ steps.list.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - id: list
        run: |
          echo "pairs=$(python -m dac customers --json)" >> "$GITHUB_OUTPUT"
          echo "ids=$(python -m dac customers --json | python -c 'import json,sys; print(json.dumps(sorted({p["customer"] for p in json.load(sys.stdin)})))')" >> "$GITHUB_OUTPUT"

  gate:
    if: github.event_name == 'pull_request' && needs.customers.outputs.pairs != '[]'
    needs: customers
    runs-on: ubuntu-latest
    environment: ${{ matrix.customer }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.customers.outputs.pairs) }}
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SENTINEL_SUBSCRIPTION_ID: ${{ secrets.SENTINEL_SUBSCRIPTION_ID }}
      SENTINEL_RESOURCE_GROUP: ${{ secrets.SENTINEL_RESOURCE_GROUP }}
      SENTINEL_WORKSPACE: ${{ secrets.SENTINEL_WORKSPACE }}
      SENTINEL_WORKSPACE_ID: ${{ secrets.SENTINEL_WORKSPACE_ID }}
      SPLUNK_URL: ${{ secrets.SPLUNK_URL }}
      SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
      SPLUNK_APP: ${{ secrets.SPLUNK_APP }}
      SECOPS_PROJECT: ${{ secrets.SECOPS_PROJECT }}
      SECOPS_REGION: ${{ secrets.SECOPS_REGION }}
      SECOPS_INSTANCE: ${{ secrets.SECOPS_INSTANCE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    permissions:
      contents: read
      id-token: write  # only used by the SecOps workload-identity step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Mint SecOps access token
        id: gcp
        if: matrix.siem == 'secops' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Schema check
        env:
          SECOPS_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        # Exit 2 means gaps were found; the gate below reports them, so do not fail here.
        run: python -m dac schema-check --customer ${{ matrix.customer }} --siem ${{ matrix.siem }} || [ $? -eq 2 ]
      - name: Log-source gate (report only)
        env:
          SECOPS_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: python -m dac gate --customer ${{ matrix.customer }} --siem ${{ matrix.siem }} --report-only
      - name: Upload reminders and schema report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.customer }}-${{ matrix.siem }}
          path: |
            reports/notifications/
            reports/schema/
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.customers.outputs.pairs != '[]'
    needs: customers
    runs-on: ubuntu-latest
    environment: ${{ matrix.customer }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.customers.outputs.pairs) }}
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SENTINEL_SUBSCRIPTION_ID: ${{ secrets.SENTINEL_SUBSCRIPTION_ID }}
      SENTINEL_RESOURCE_GROUP: ${{ secrets.SENTINEL_RESOURCE_GROUP }}
      SENTINEL_WORKSPACE: ${{ secrets.SENTINEL_WORKSPACE }}
      SENTINEL_WORKSPACE_ID: ${{ secrets.SENTINEL_WORKSPACE_ID }}
      SPLUNK_URL: ${{ secrets.SPLUNK_URL }}
      SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
      SPLUNK_APP: ${{ secrets.SPLUNK_APP }}
      SECOPS_PROJECT: ${{ secrets.SECOPS_PROJECT }}
      SECOPS_REGION: ${{ secrets.SECOPS_REGION }}
      SECOPS_INSTANCE: ${{ secrets.SECOPS_INSTANCE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Mint SecOps access token
        id: gcp
        if: matrix.siem == 'secops' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Gate and deploy
        env:
          SECOPS_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: python -m dac deploy --customer ${{ matrix.customer }} --siem ${{ matrix.siem }} --mode auto
      - name: Upload plan and reminders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ matrix.customer }}-${{ matrix.siem }}
          path: |
            build/
            reports/notifications/
          if-no-files-found: ignore

  coverage:
    # Runs after deploy even when deploy is red: a blocked rule makes deploy
    # exit 2, and coverage is where that gap is reported (it re-runs the gate).
    if: >-
      !cancelled() && needs.customers.result == 'success'
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.customers.outputs.ids != '[]'
    needs: [customers, deploy]
    runs-on: ubuntu-latest
    environment: ${{ matrix.customer }}
    strategy:
      fail-fast: false
      matrix:
        customer: ${{ fromJSON(needs.customers.outputs.ids) }}
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SENTINEL_SUBSCRIPTION_ID: ${{ secrets.SENTINEL_SUBSCRIPTION_ID }}
      SENTINEL_RESOURCE_GROUP: ${{ secrets.SENTINEL_RESOURCE_GROUP }}
      SENTINEL_WORKSPACE: ${{ secrets.SENTINEL_WORKSPACE }}
      SENTINEL_WORKSPACE_ID: ${{ secrets.SENTINEL_WORKSPACE_ID }}
      SPLUNK_URL: ${{ secrets.SPLUNK_URL }}
      SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
      SPLUNK_APP: ${{ secrets.SPLUNK_APP }}
      SECOPS_PROJECT: ${{ secrets.SECOPS_PROJECT }}
      SECOPS_REGION: ${{ secrets.SECOPS_REGION }}
      SECOPS_INSTANCE: ${{ secrets.SECOPS_INSTANCE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download ATT&CK bundle
        run: |
          mkdir -p data
          curl -sSfL -o data/enterprise-attack.json \
            https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
      - name: Coverage layers and summary
        run: |
          python -m dac coverage --customer ${{ matrix.customer }} --attack-bundle data/enterprise-attack.json
          cat reports/coverage/${{ matrix.customer }}/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.customer }}
          path: reports/coverage/
