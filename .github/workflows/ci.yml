# Detection-as-code pipeline. What each job proves, and what it does not,
# is in docs/components/ci.md.
#
#   validate  every push and PR: lint, tests, rule validation against
#             the current MITRE ATT&CK bundle
#   gate      PRs: log-source gate in report-only mode, so owning teams
#             get the reminder while the rule is still in review
#   deploy    push to main: gate (blocking), then deploy per SIEM;
#             live only when that SIEM's secrets exist, otherwise dry-run
name: detection-pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint YAML
        run: yamllint .
      - name: Unit tests
        run: python -m pytest
      - name: ATT&CK cache key (ISO week)
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Cache ATT&CK bundle
        uses: actions/cache@v4
        with:
          path: data/enterprise-attack.json
          # Refreshed weekly so new ATT&CK releases (and deprecations) are picked up.
          key: attack-stix-${{ steps.week.outputs.week }}
      - name: Download ATT&CK bundle
        run: |
          mkdir -p data
          if [ ! -s data/enterprise-attack.json ]; then
            curl -sSfL -o data/enterprise-attack.json \
              https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
          fi
      - name: Validate rules
        run: python -m dac validate --attack-bundle data/enterprise-attack.json

  gate:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        siem: [sentinel, splunk, secops]
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Log-source gate (report only)
        run: python -m dac gate --siem ${{ matrix.siem }} --report-only
      - name: Upload reminders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-source-reminders-${{ matrix.siem }}
          path: reports/notifications/
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # only used by the SecOps workload-identity step
    strategy:
      fail-fast: false
      matrix:
        siem: [sentinel, splunk, secops]
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      SENTINEL_SUBSCRIPTION_ID: ${{ secrets.SENTINEL_SUBSCRIPTION_ID }}
      SENTINEL_RESOURCE_GROUP: ${{ secrets.SENTINEL_RESOURCE_GROUP }}
      SENTINEL_WORKSPACE: ${{ secrets.SENTINEL_WORKSPACE }}
      SPLUNK_URL: ${{ secrets.SPLUNK_URL }}
      SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
      SPLUNK_APP: ${{ secrets.SPLUNK_APP }}
      SECOPS_PROJECT: ${{ secrets.SECOPS_PROJECT }}
      SECOPS_REGION: ${{ secrets.SECOPS_REGION }}
      SECOPS_INSTANCE: ${{ secrets.SECOPS_INSTANCE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Mint SecOps access token
        id: gcp
        if: matrix.siem == 'secops' && env.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Gate and deploy
        env:
          SECOPS_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: python -m dac deploy --siem ${{ matrix.siem }} --mode auto
      - name: Upload plan and reminders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ matrix.siem }}
          path: |
            build/
            reports/notifications/
          if-no-files-found: ignore
